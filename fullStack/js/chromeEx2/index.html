<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        
     </head>
    <body>
        <div id="main">
        <h2>Metric/Imperial Unit Conversion</h2>
        <input type="number" id="inputNumber" placeholder="00">
        <button id="convertBtn">Convert</button>
        </div>
        <div id="option">
            <div >
                <label class="optionLabel">Length (Meter/Feet)</label>
                <p id="length">#number measure = #number measure | #number measure = #number measure</p>
            </div>
            <div >
                <label class="optionLabel">Volume (Liters/Gallons)</label>
                <p id="volume">#number measure = #number measure | #number measure = #number measure</p>
            </div>
            <div >
                <label class="optionLabel">Mass (Kilograms/Pounds)</label>
                <p id="mass">#number measure = #number measure | #number measure = #number measure</p>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
